<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sistema de Vendas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Base: quadrado arredondado em violeta-ultramar -->
  <rect width="64" height="64" rx="18" fill="#5a3df0"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- V de Vendas: o braço direito, mais longo, sobe como uma curva de crescimento -->
  <path d="M16 22 29 45 46 18" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ponto laranja: o olhal de uma etiqueta de preço no topo do crescimento -->
  <circle cx="46" cy="18" r="5.4" fill="#ff9f1c"/>
</svg>
