<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vendas</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow border-0" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <h2 class="text-center fw-bold mb-4">Login</h2>

            <div class="alert alert-danger" th:if="${param.error != null}">
                E-mail ou senha inválidos!
            </div>

            <div class="alert alert-success" th:if="${param.logout != null}">
                Você saiu da aplicação.
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="username" class="form-label">Email:</label>
                    <input id="username" name="username" type="email" class="form-control" placeholder="seuemail@exemplo.com" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha:</label>
                    <input id="password" name="password" type="password" class="form-control" placeholder="Sua senha" required>
                </div>

                <div class="form-check mb-4">
                    <input id="remember-me" name="remember-me" type="checkbox" class="form-check-input">
                    <label for="remember-me" class="form-check-label">Lembrar de mim</label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
